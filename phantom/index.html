<title>Phantom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen game. A full-bleed night scene (canvas) with a ghost in the middle;
   HUD on top, big tap tiles at the bottom. Single dark look by choice. */
:root{
  color-scheme:dark;
  --night:#0B0514; --bone:#F4EFE6; --dim:#9486AE; --tile:#140A22; --edge:#2C1A47;
  --pumpkin:#FF7A1A; --slime:#8FE04A;
  --t-common:#8C84A0; --t-uncommon:#8FE04A; --t-rare:#B07CFF; --t-epic:#FF7A1A; --t-legend:#FFD23F; --t-miss:#6E5F86;
  --display:"Creepster","Chalkduster","Impact",fantasy;
  --body:"Rubik","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--bone);font-family:var(--body);font-size:16px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;padding-block:14px 18px;display:flex;flex-direction:column;gap:12px}
.app.quake{animation:quake .45s}
@keyframes quake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}

.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hud button{background:none;border:0;color:var(--bone);cursor:pointer;border-radius:10px;padding:6px 8px;margin:-6px -8px}
.logo{font:400 26px/1 var(--display);letter-spacing:.04em;color:var(--pumpkin)}
.right{display:flex;align-items:center;gap:14px}
.alt{font:800 20px/1 var(--body);font-variant-numeric:tabular-nums}
.alt small{font-size:12px;color:var(--dim);margin-left:3px}
#snd{font:700 12px/1 var(--body);color:var(--dim);letter-spacing:.08em}
:focus-visible{outline:3px solid var(--t-legend);outline-offset:2px}

#stage{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;animation:fade .35s both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.top{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}

.title{font:400 clamp(64px,22vw,104px)/.9 var(--display);color:var(--pumpkin);letter-spacing:.03em;margin:8px 0 0;text-shadow:0 5px 0 #7A2A00;animation:wob 3.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-2deg) translateY(4px)}}
.tag{font-weight:700;font-size:17px;color:var(--bone);margin:0}
.meta{font-weight:700;font-size:13px;color:var(--bone);text-shadow:0 1px 0 rgba(0,0,0,.6);margin:0;font-variant-numeric:tabular-nums}

.big{font:800 20px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:18px;padding:20px;cursor:pointer;width:100%;color:#1B0D2E;background:var(--pumpkin);box-shadow:0 6px 0 #A8480A;transition:transform .08s,box-shadow .08s;display:flex;justify-content:center;align-items:baseline;gap:10px}
.big small{font-size:13px;letter-spacing:0;text-transform:none;opacity:.75;font-weight:700}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 #A8480A}
.big.alt2{background:var(--t-rare);box-shadow:0 6px 0 #6B3FC0}
.big.alt2:active{box-shadow:0 1px 0 #6B3FC0}
.big.flat{background:#1C0F2E;color:var(--bone);box-shadow:0 6px 0 #05020A;font-size:15px;padding:16px}
.big.flat:active{box-shadow:0 1px 0 #05020A}
.btns{display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.pips{display:flex;gap:7px;justify-content:center}
.pips{width:100%}
.pip{flex:0 1 26px;height:8px;border-radius:4px;background:var(--edge);transition:background .3s}
.pip.now{background:var(--bone)}
.hint{font:700 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--slime)}
.q{font:800 clamp(22px,6.4vw,30px)/1.12 var(--body);margin:0;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.45)}

.top{width:100%}
.ask{display:flex;gap:8px;width:100%;margin-top:4px}
.ask input{flex:1;min-width:0;font:700 18px/1 var(--body);color:var(--bone);background:#07030D;border:2px solid var(--edge);border-radius:16px;padding:15px 16px;user-select:text;-webkit-user-select:text}
.ask input:focus{outline:0;border-color:var(--pumpkin)}
.ask input::placeholder{color:#5E5177}
.ask .big{width:auto;flex:none;padding:0 22px;font-size:17px;align-items:center}
.shake{animation:quake .36s}
.under{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:28px}
.lives{display:flex;gap:7px;align-items:center}
.lives i{width:13px;height:13px;border-radius:50%;background:var(--pumpkin);transition:all .3s}
.lives i.gone{background:var(--edge);transform:scale(.6)}
.skip{background:none;border:0;color:var(--dim);font:700 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:8px;border-radius:8px}
.fuse{width:100%;height:6px;border-radius:3px;background:var(--edge);overflow:hidden}
.fuse i{display:block;height:100%;background:var(--pumpkin);transform-origin:left;border-radius:3px}
.combo{display:flex;align-items:center;gap:6px}
.combo i{width:10px;height:10px;transform:rotate(45deg);background:var(--edge);border-radius:2px;transition:background .3s}
.combo i.on{background:var(--t-rare)}
.combo b{font:800 15px/1 var(--body);color:var(--t-legend);margin-left:4px}
.tools{display:flex;gap:2px}
.skip:disabled{opacity:.3;cursor:default}
#pop em{display:block;font:800 12px/1.8 var(--body);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--bone);text-shadow:0 2px 0 rgba(0,0,0,.6)}
.later{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px;max-height:56vh;overflow:auto}
.later h3{font:800 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--slime);margin:10px 0 2px}
.later p{margin:0;padding:11px 14px;border-radius:12px;background:var(--tile);border:2px solid var(--edge);font-weight:500;font-size:14px;line-height:1.35;color:var(--dim)}
.later p b{color:var(--bone);display:block}
.textlink{background:none;border:0;color:var(--dim);font:700 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:6px;align-self:center;border-radius:8px}
.board:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:36px}
.chipx{font:700 13px/1 var(--body);padding:8px 10px;border-radius:10px;background:var(--tile);border:2px solid var(--edge);color:var(--dim);animation:drop .35s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d)}
.chipx b{color:var(--c);margin-left:6px;font-variant-numeric:tabular-nums}
.chipx.me{border-color:var(--c);color:var(--bone)}
@keyframes drop{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:none}}
.t-common{--c:var(--t-common)}.t-uncommon{--c:var(--t-uncommon)}.t-rare{--c:var(--t-rare)}.t-epic{--c:var(--t-epic)}.t-legend{--c:var(--t-legend)}.t-miss{--c:var(--t-miss)}
.pair .big{padding:18px 8px;font-size:17px}
.big.green{background:var(--slime);box-shadow:0 6px 0 #4E8A1E}
.big.green:active{box-shadow:0 1px 0 #4E8A1E}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field{width:100%;font:700 18px/1 var(--body);color:var(--bone);background:#07030D;border:2px solid var(--edge);border-radius:16px;padding:15px 16px;text-align:center;user-select:text;-webkit-user-select:text}
.field:focus{outline:0;border-color:var(--pumpkin)}
.field::placeholder{color:#5E5177}
.field.link{font-size:13px;font-weight:500;color:var(--dim);padding:12px;text-overflow:ellipsis}
.board{width:100%;display:flex;flex-direction:column;gap:6px;max-height:32vh;overflow:auto}
.rowb{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;padding:11px 14px;border-radius:12px;background:var(--tile);border:2px solid var(--edge);font-weight:700;text-align:left;font-variant-numeric:tabular-nums;animation:drop .35s both;animation-delay:var(--d)}
.rowb span:first-child{color:var(--dim)}
.rowb span:nth-child(2){overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.04em}
.rowb.me{border-color:var(--pumpkin)}

#pop{position:fixed;left:0;right:0;top:30%;z-index:3;text-align:center;pointer-events:none}
#pop div{animation:pop 1.7s cubic-bezier(.2,.9,.3,1) both;color:var(--c)}
#pop b{display:block;font:400 clamp(54px,17vw,84px)/1 var(--display);text-shadow:0 4px 0 rgba(0,0,0,.55)}
#pop span{font:800 14px/1 var(--body);letter-spacing:.22em;text-transform:uppercase}
@keyframes pop{0%{opacity:0;transform:translateY(40px) scale(.4)}18%{opacity:1;transform:translateY(0) scale(1.12)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}

.score{font:400 clamp(72px,24vw,120px)/.9 var(--display);color:var(--t-legend);text-shadow:0 5px 0 rgba(0,0,0,.5);font-variant-numeric:tabular-nums;margin-top:6px}
.score small{font-size:.35em;margin-left:.1em}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:22px;height:22px;border-radius:7px;background:var(--c);animation:drop .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
@media (max-height:760px){.btns{gap:10px}.big{padding:15px}.title{font-size:60px}}
@media (max-height:640px){.q{font-size:21px}.big{padding:15px}.title{font-size:60px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="hud">
    <button class="logo" id="home-btn" type="button" aria-label="Phantom, back to start">Phantom</button>

      <div class="alt"><span id="alt-read">0</span><small>m</small></div>

  </header>
  <main id="stage"></main>
</div>
<div id="pop" aria-live="polite"></div>

const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/&/g,"and").trim().replace(/^(the|lake|a|an)\s+/,"").replace(/[^a-z0-9]/g,"");

function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let prev=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
function match(q,text){
  const t=norm(text);if(!t)return null;
  for(const a of q.answers)if(a.keys.includes(t))return a;
  const tol=t.length>=9?2:t.length>=5?1:0;if(!tol)return null;
  let best=null,bd=9,tie=false;
  for(const a of q.answers)for(const k of a.keys){if(k.length<4)continue;const d=lev(t,k);if(d<bd){bd=d;best=a;tie=false}else if(d===bd&&a!==best)tie=true}
  return bd<=tol&&!tie?best:null;
}

const gapDir=()=>target>=shown?1:-1;

function frame(ts){
  const dt=Math.min(3,(ts-last)/16.7||1);last=ts;clock+=dt/60;
  const gap=target-shown;
  if(reduced)shown=target;else shown+=gap*Math.min(1,.05*dt);
  if(Math.abs(target-shown)<.6)shown=target;
  rush=reduced?0:Math.min(1,Math.abs(gap)/450);
  const t=Math.min(1,shown/MOON),c=skyAt(t),dir=gapDir();
  altRead.textContent=fmt(shown);
  cx.globalAlpha=1;cx.fillStyle=`rgb(${c})`;cx.fillRect(0,0,W,H);
  document.body.style.background=`rgb(${c})`;
  gyC+=(gyT-gyC)*Math.min(1,.12*dt);const gy=gyC;
  // stars
  cx.fillStyle="#F4EFE6";
  for(const s of stars){const y=((s.y*H+shown*.05)%H+H)%H,x=s.x*W;cx.globalAlpha=(.3+.6*t)*(.6+.4*Math.sin(clock*2+s.ph));
    if(rush>.15)cx.fillRect(x,y,1.5,dir*rush*26);else{cx.beginPath();cx.arc(x,y,s.r,0,7);cx.fill()}}
  // moon: far away at first, fills the sky by the top
  const mr=26+(Math.min(W,H)*.34-26)*t,mx=W*.84+(W/2-W*.84)*t,my=gy-120+120*t;
  cx.globalAlpha=.1;cx.fillStyle="#FFE9A8";cx.beginPath();cx.arc(mx,my,mr*1.35,0,7);cx.fill();
  cx.globalAlpha=1;cx.fillStyle="#F6E7B0";cx.beginPath();cx.arc(mx,my,mr,0,7);cx.fill();
  cx.fillStyle="#E2CD8A";for(const[a,b,r]of[[-.35,-.25,.2],[.3,.1,.14],[-.1,.45,.17],[.42,-.42,.09]]){cx.beginPath();cx.arc(mx+a*mr,my+b*mr,r*mr,0,7);cx.fill()}
  // clouds at fixed altitudes
  cx.fillStyle="#170C29";
  for(const cl of clouds){const y=gy+(shown-cl.alt)*PPM;cl.x+=cl.v*dt;if(cl.x>1.3)cl.x=-.3;if(cl.x<-.3)cl.x=1.3;if(y<-60||y>H+60)continue;const x=cl.x*W,w=cl.w;cx.globalAlpha=.8;
    cx.beginPath();cx.ellipse(x,y,w*.5,w*.13,0,0,7);cx.ellipse(x-w*.2,y-w*.08,w*.22,w*.14,0,0,7);cx.ellipse(x+w*.14,y-w*.1,w*.26,w*.17,0,0,7);cx.fill()}
  cx.globalAlpha=1;
  ground(gy+H*.17+shown*PPM);

  cx.fillStyle="#040208";
  for(const b of bats){b.x+=b.dir*b.v*.0022*dt;b.ph+=.3*dt;b.y+=dir*rush*.03*dt;if(b.x>1.1){b.x=-.1;b.y=.08+Math.random()*.5}if(b.x<-.1){b.x=1.1;b.y=.08+Math.random()*.5}if(b.y>1.1)b.y=-.05;
    drawBat(b.x*W,b.y*H+Math.sin(b.ph*.3)*6,b.s,Math.sin(b.ph)*b.s*.7)}

  if(rush>.12&&!reduced)for(let i=0;i<2;i++)parts.push({x:W/2+(Math.random()-.5)*40,y:gy+44,vx:(Math.random()-.5)*1.2,vy:dir*(3+Math.random()*5),life:.8,c:"#F4EFE6",r:2+Math.random()*4});

}

function tick(){
  if(!G||G.phase!=="ask")return;
  const f=Math.max(0,(G.tEnd-performance.now())/TIME),el=document.getElementById("fuse");
  if(el){el.style.transform=`scaleX(${f})`;el.style.background=f<.3?"#E0321E":""}
  if(f<=0)reveal(null,"Too slow");
}
function drawBat(x,y,s,f){
  cx.beginPath();cx.moveTo(x,y);cx.quadraticCurveTo(x-s,y-s*.9-f,x-s*2,y-f*.6);cx.quadraticCurveTo(x-s*1.2,y+s*.1,x-s*.6,y+s*.45);cx.lineTo(x,y+s*.25);cx.lineTo(x+s*.6,y+s*.45);cx.quadraticCurveTo(x+s*1.2,y+s*.1,x+s*2,y-f*.6);cx.quadraticCurveTo(x+s,y-s*.9-f,x,y);cx.fill();
}
// one-off events: a bat that knocks you, a witch and a shooting star that lift you
function drawFx(gy,dt){
  knock*=Math.pow(.94,dt);
  if(!fx)return;
  fx.t+=dt/60;const k=fx.t/fx.d;if(k>=1){fx=null;return}
  if(fx.type==="bat"){
    const x=W*(1.2-1.4*k),y=gy-90+Math.sin(k*Math.PI)*95,s=24;
    cx.fillStyle="#040208";drawBat(x,y,s,Math.sin(clock*26)*s*.7);
    cx.fillStyle="#E0321E";cx.beginPath();cx.arc(x-5,y+3,2.4,0,7);cx.arc(x+5,y+3,2.4,0,7);cx.fill();
    if(k>.42&&!fx.hit){fx.hit=1;knock=1;burst("#E0321E",14)}
  }else if(fx.type==="star"){
    const x=W*(-.15+1.3*k),y=gy-H*.28+k*H*.14;
    const g=cx.createLinearGradient(x-170,y-52,x,y);g.addColorStop(0,"rgba(255,210,63,0)");g.addColorStop(1,"rgba(255,210,63,.95)");
    cx.strokeStyle=g;cx.lineWidth=5;cx.lineCap="round";cx.beginPath();cx.moveTo(x-170,y-52);cx.lineTo(x,y);cx.stroke();
    cx.fillStyle="#FFF3C4";cx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5+clock*3,r=i%2?5:13;cx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}cx.fill();
  }else{
    const x=W*(-.25+1.5*k),y=gy-150+Math.sin(k*9)*12,s=26;
    cx.strokeStyle="#040208";cx.fillStyle="#040208";cx.lineWidth=4;cx.lineCap="round";
    cx.beginPath();cx.moveTo(x-s*1.9,y+s*.25);cx.lineTo(x+s*1.5,y);cx.stroke();
    cx.beginPath();cx.moveTo(x-s*1.5,y+s*.2);cx.lineTo(x-s*2.6,y-s*.15);cx.lineTo(x-s*2.6,y+s*.7);cx.fill();
    cx.beginPath();cx.moveTo(x+s*.3,y-s*.1);cx.lineTo(x-s*.1,y-s*1.0);cx.lineTo(x-s*1.5,y-s*.3);cx.lineTo(x-s*.5,y+s*.1);cx.fill();
    cx.beginPath();cx.arc(x+s*.15,y-s*1.1,s*.27,0,7);cx.fill();
    cx.beginPath();cx.moveTo(x-s*.35,y-s*1.25);cx.lineTo(x+s*.7,y-s*1.3);cx.lineTo(x+s*.05,y-s*2.2);cx.fill();
    cx.fillStyle="#B07CFF";cx.fillRect(x-s*.2,y-s*1.42,s*.62,s*.12);
  }
}

function draw7(rand){
  let pool=QS.map((_,i)=>i).filter(i=>!G.used.has(i));
  if(pool.length<7){G.used.clear();pool=QS.map((_,i)=>i)}
  const qs=shuffle(pool,rand).slice(0,7);qs.forEach(i=>G.used.add(i));G.qs.push(...qs);
}
const newRun=(mode,len,extra)=>Object.assign({mode,len,qs:[],used:new Set(),i:0,total:0,results:[],phase:"ask",lives:3,combo:0,peek:1,counted:false},extra);
function start(mode){
  G=newRun(mode,7);
  draw7(mode==="daily"?rng("phantom3-"+today()):Math.random);
  tone(200,500,.25);question();
}
function more(){if(!G)return start("free");G.peek=1;draw7(Math.random);tone(200,500,.25);question()}
const livesHtml=()=>[0,1,2].map(k=>`<i class="${k<G.lives?"":"gone"}"></i>`).join("");
const comboHtml=()=>[0,1,2].map(k=>`<i class="${k<G.combo?"on":""}"></i>`).join("")+(G.combo>=3?"<b>x2</b>":"");
function question(){
  const q=QS[G.qs[G.i]],r0=G.i-G.i%G.len;G.phase="ask";G.lives=3;
  clearTimeout(timer);pop.innerHTML="";
  if(!document.getElementById("answer"))show(`<section class="screen">
    <div class="top">
      <div class="pips" id="pips"></div>
      <span class="hint">Type a rare one</span>
      <h2 class="q" id="qtext"></h2>
      <form class="ask" id="ask" autocomplete="off"><input id="answer" type="text" placeholder="Your answer" aria-label="Your answer" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"><button class="big" type="submit">Go</button></form>
      <div class="fuse" aria-hidden="true"><i id="fuse"></i></div>
      <div class="under"><span class="lives" id="lives" aria-label="Tries left"></span><span class="combo" id="combo" aria-label="Rare streak"></span>
        <span class="tools"><button class="skip" type="button" data-act="peek" id="peek">Peek</button><button class="skip" type="button" data-act="skip">Skip</button></span></div>
      <div class="chips" id="chips"></div>
    </div><div></div>
  </section>`);
  document.getElementById("pips").innerHTML=Array.from({length:G.len},(_,k)=>{const r=G.results[r0+k];return`<span class="pip ${r0+k===G.i?"now":""}" ${r?`style="background:${TCOL[r.tier]}"`:""}></span>`}).join("");
  const qt=document.getElementById("qtext");qt.textContent=q.q;qt.style.animation="none";void qt.offsetWidth;qt.style.animation="fade .35s both";
  document.getElementById("lives").innerHTML=livesHtml();
  document.getElementById("combo").innerHTML=comboHtml();
  document.getElementById("peek").disabled=!G.peek;
  document.getElementById("chips").innerHTML="";
  const input=document.getElementById("answer");input.value="";input.focus({preventScroll:true});place();
  G.tEnd=performance.now()+TIME;
}
function peek(){
  if(!G||G.phase!=="ask"||!G.peek)return;G.peek=0;
  const q=QS[G.qs[G.i]],top=[...q.answers].sort((x,y)=>pct(q,y)-pct(q,x))[0];
  document.getElementById("chips").innerHTML=`<span class="chipx t-common me">Everyone says ${esc(top.name)}</span>`;
  document.getElementById("peek").disabled=true;tone(500,300,.2,"sine");place();
  document.getElementById("answer").focus({preventScroll:true});
}
function submit(){
  if(!G||G.phase!=="ask")return;
  const input=document.getElementById("answer");
  if(!input.value.trim()){input.focus();return}
  const a=match(QS[G.qs[G.i]],input.value);
  if(a)return reveal(a);
  G.lives--;document.getElementById("lives").innerHTML=livesHtml();
  tone(170,80,.22,"sawtooth",.07);
  if(G.lives<=0)return reveal(null);
  const box=input.parentElement;box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake");input.select();
}
function reveal(a,why){
  const now=performance.now(),frac=Math.max(0,(G.tEnd-now)/TIME),q=QS[G.qs[G.i]];
  G.phase="reveal";G.lockedAt=now;
  let rise=0,tier="miss",label=why||"Lost",rank=-1;const tags=[];
  if(a){
    const p=pct(q,a);[tier,label]=tierFor(p);rank=RANKS.indexOf(tier);
    const dbl=G.combo>=3;rise=Math.round(riseFor(p)*(dbl?2:1)*(1+.25*frac));
    if(dbl)tags.push("x2");if(frac>.6)tags.push("Fast");
    if(rank===0){rise=Math.max(0,rise-120);tags.push("Bat −120");fx={type:"bat",t:0,d:.9}}
    else if(rank===3){rise+=200;tags.push("Witch +200");fx={type:"witch",t:0,d:1.5}}
    else if(rank===4){rise+=400;tags.push("Star +400");fx={type:"star",t:0,d:1.1}}
    G.combo=rank>=2?G.combo+1:0;
  }else G.combo=0;
  G.results[G.i]={tier,rise};G.total+=rise;target=G.total;
  const pip=document.querySelectorAll(".pip")[G.i%G.len];if(pip)pip.style.background=TCOL[tier];
  const sorted=[...q.answers].sort((x,y)=>pct(q,y)-pct(q,x)),rows=[...new Set([...sorted.slice(0,3),a,sorted[sorted.length-1]].filter(Boolean))].sort((x,y)=>pct(q,y)-pct(q,x));
  document.getElementById("chips").innerHTML=rows.map((x,k)=>`<span class="chipx t-${tierFor(pct(q,x))[0]} ${x===a?"me":""}" style="--d:${k*.07}s">${esc(x.name)}<b>${show1(pct(q,x))}%</b></span>`).join("");
  document.getElementById("combo").innerHTML=comboHtml();
  place();
  if(a){const key=a.keys[0],s=stats[q.id]=stats[q.id]||{};s[key]=(s[key]||0)+1;api("/answer",{q:q.id,a:key})}
  mood=rank>=2?1:rank<=0?2:0;moodUntil=clock+2;
  if(a){burst(TCOL[tier],10+rank*12);tone(180,260+Math.min(1500,rise)*.75,.45,"triangle");if(rank>=3)setTimeout(()=>tone(700,1400,.3,"sine",.08),160);if(rank===0)setTimeout(()=>tone(140,60,.3,"sawtooth",.08),380)}
  if(rank>=3&&!reduced){app.classList.remove("quake");void app.offsetWidth;app.classList.add("quake")}
  pop.innerHTML=`<div class="t-${tier}"><b>+${fmt(rise)}</b><span>${label}</span>${tags.length?`<em>${tags.join(" · ")}</em>`:""}</div>`;
  timer=setTimeout(next,2600);
}
function next(){
  clearTimeout(timer);if(!G||G.phase!=="reveal")return;
  G.i++;if(G.i%G.len)return question();
  if(G.mode==="vs")return vsDone();
  if(!G.counted){G.counted=true;save.plays++;
    if(G.mode==="daily"){const y=new Date();y.setDate(y.getDate()-1);save.streak=save.lastDaily===dayKey(y)?save.streak+1:1;save.lastDaily=today();save.daily={date:today(),total:G.total,results:G.results.slice(0,7)}}}
  save.best=Math.max(save.best,G.total);persist();loadStats();
  G.phase="end";end(G.mode,G.total,G.results.slice(-7),G.i/7);
}
const SQ={common:"⬜",uncommon:"🟩",rare:"🟪",epic:"🟧",legend:"🟨",miss:"⬛"};
let shareText="";
function end(mode,total,res,round=1){
  target=total;const left=MOON-total,daily=mode==="daily"&&round===1;
  shareText=`Phantom ${daily?"Daily Rise":"Free Rise"}${round>1?" x"+round:""}\n${fmt(total)} m 👻\n${res.map(r=>SQ[r.tier]).join("")}`;
  tone(300,900,.5,"sine");
  show(`<section class="screen">
    <div class="top">
      <div class="score"><span id="score">0</span><small>m</small></div>
      <div class="dots">${res.map((r,k)=>`<i style="--c:${TCOL[r.tier]};--d:${.3+k*.09}s"></i>`).join("")}</div>
      <p class="meta">${left<=0?"Past the moon":fmt(left)+" m to the moon"}</p>
      ${daily&&API?`<div class="board" id="dboard"></div>`:""}
    </div>
    <div class="btns">
      <div class="pair"><button class="big" data-act="more" type="button">7 more</button><button class="big flat" data-act="home" type="button">Stop</button></div>
      <button class="big flat" data-act="share" id="share" type="button">Copy score</button>
    </div>
  </section>`);
  if(daily)dailyBoard();
  const el=document.getElementById("score");if(reduced){el.textContent=fmt(total);return}
  const t0=performance.now();(function step(now){const k=Math.min(1,(now-t0)/1300),e=1-Math.pow(1-k,3);el.textContent=fmt(total*e);if(k<1&&el.isConnected)requestAnimationFrame(step)})(t0);
}
// today's leaderboard (hosted version only)
async function dailyBoard(){
  const el=document.getElementById("dboard");if(!el||!API||!save.daily)return;
  const id="d-"+save.daily.date;
  if(!save.daily.posted){
    if(!save.name){el.innerHTML=`<form class="ask" id="nameform" autocomplete="off"><input class="field" id="pname" type="text" maxlength="10" placeholder="Name for the board" aria-label="Your name" autocapitalize="off" spellcheck="false"><button class="big" type="submit">Post</button></form>`;return}
    if(await api("/score",{board:id,name:save.name,score:save.daily.total})){save.daily.posted=true;persist()}
  }
  const b=await api("/board?id="+id);

}
function share(){

  try{navigator.clipboard.writeText(shareText).then(()=>{b.textContent="Copied"},()=>{b.textContent="Copy blocked"})}catch(e){b.textContent="Copy blocked"}
}

/* ---------- challenge mode: same questions for everyone; scores travel in the link, and update live when hosted ---------- */
const VS_RE=/^#?vs-(10|15|20)-([a-z0-9]{4,8})((?:-[a-z0-9]{1,10}-\d{1,6})*)$/;
const LINK_BASE="https://phantom-rise.netlify.app/";
const setHash=h=>{try{if(location.hash.replace("#","")!==h)location.hash=h}catch(e){}};
let V=null;
function vsParse(hash){
  const m=VS_RE.exec(hash||"");if(!m)return null;
  const scores={},parts=m[3].split("-").filter(Boolean);
  for(let i=0;i<parts.length;i+=2)scores[parts[i]]=Math.max(scores[parts[i]]||0,+parts[i+1]);
  return{n:+m[1],seed:m[2],scores};
}
function vsMerge(st,scores){let changed=false;for(const[n,s]of Object.entries(scores||{}))if(!(st.scores[n]>=s)){st.scores[n]=s;changed=true}return changed}
function vsLoad(v){
  save.vs=save.vs||{};const key=v.n+"-"+v.seed,st=save.vs[key]||(save.vs[key]={scores:{},mine:null});
  vsMerge(st,v.scores);persist();return{n:v.n,seed:v.seed,key,st};
}
const vsCode=()=>"vs-"+V.key+Object.entries(V.st.scores).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([n,s])=>"-"+n+"-"+s).join("");
const vsLink=()=>(inViewer()?LINK_BASE:location.href.split("#")[0])+"#"+vsCode();
function vsNew(){
  G=null;target=0;
  show(`<section class="screen">
    <div class="top"><span class="hint">Challenge</span><h2 class="q">How many questions?</h2></div>
    <div class="btns"><div class="trio">${[10,15,20].map(n=>`<button class="big green" data-vs="${n}" type="button">${n}</button>`).join("")}</div>
      <button class="big flat" data-act="home" type="button">Back</button></div>
  </section>`);
}
function vsCreate(n){
  const abc="abcdefghjkmnpqrstuvwxyz23456789",seed=Array.from({length:6},()=>abc[Math.floor(Math.random()*abc.length)]).join("");
  V=vsLoad({n,seed,scores:{}});vsLobby();
}
async function vsPoll(){
  if(!V)return;const key=V.key,b=await api("/board?id=vs-"+key);
  if(!b||!V||V.key!==key||!vsMerge(V.st,b.scores))return;
  persist();const el=document.getElementById("board"),link=document.getElementById("link");
  if(el)el.innerHTML=boardHtml(Object.entries(V.st.scores),V.st.mine);if(link)link.value=vsLink();
}
function vsLobby(total){
  G=null;target=total||0;setHash(vsCode());
  const played=V.st.mine!=null;
  show(`<section class="screen">
    <div class="top">
      <span class="hint">Challenge · ${V.n} questions</span>
      ${total!=null?`<div class="score"><span>${fmt(total)}</span><small>m</small></div>`:`<h2 class="q">${played?"Send the link. Beat them all.":"Same questions for everyone"}</h2>`}
      ${played?"":`<input class="field" id="pname" type="text" maxlength="10" placeholder="Your name" aria-label="Your name" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(save.name||"")}">`}
      <div class="board" id="board">${boardHtml(Object.entries(V.st.scores),V.st.mine)}</div>
    </div>
    <div class="btns">
      <input class="field link" id="link" type="text" readonly aria-label="Challenge link" value="${esc(vsLink())}">
      <div class="pair">${played?`<button class="big" data-act="vs-copy" id="share" type="button">Copy link</button><button class="big flat" data-act="home" type="button">Home</button>`
        :`<button class="big" data-act="vs-play" type="button">Play</button><button class="big flat" data-act="vs-copy" id="share" type="button">Copy link</button>`}</div>
    </div>
  </section>`);
  if(API){vsPoll();pollT=setInterval(vsPoll,4000)}
}
function vsPlay(){
  let name=cleanName(document.getElementById("pname").value)||"ghost"+(10+Math.floor(Math.random()*90));
  if(V.st.scores[name]!=null)name=name.slice(0,9)+"2";
  save.name=name;persist();
  G=newRun("vs",V.n,{name,counted:true,qs:shuffle(QS.map((_,i)=>i),rng("vs-"+V.seed)).slice(0,V.n)});
  tone(200,500,.25);question();
}
function vsDone(){
  const total=G.total;V.st.mine=G.name;V.st.scores[G.name]=total;persist();
  api("/score",{board:"vs-"+V.key,name:G.name,score:total});loadStats();
  tone(300,900,.5,"sine");vsLobby(total);
}
function vsCopy(){
  const b=document.getElementById("share"),box=document.getElementById("link"),pick=()=>{box.focus();box.select();b.textContent="Select + copy"};
  try{navigator.clipboard.writeText(box.value).then(()=>{b.textContent="Copied"},pick)}catch(e){pick()}
}
function route(){
  const v=vsParse(location.hash);if(!v)return false;
  const key=v.n+"-"+v.seed,same=V&&V.key===key,fresh=Object.entries(v.scores).some(([n,s])=>!same||!(V.st.scores[n]>=s));
  if(same&&(G||!fresh))return true;
  V=vsLoad(v);vsLobby();return true;
}
addEventListener("hashchange",route);

stage.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="nameform"){save.name=cleanName(document.getElementById("pname").value)||"ghost"+(10+Math.floor(Math.random()*90));persist();return dailyBoard()}
  submit();
});
stage.addEventListener("click",e=>{
  const n=e.target.closest("[data-vs]");if(n)return vsCreate(+n.dataset.vs);
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act;
  if(act==="daily")start("daily");else if(act==="free")start("free");
  else if(act==="more")more();
  else if(act==="vs-new")vsNew();else if(act==="vs-play")vsPlay();else if(act==="vs-copy")vsCopy();
  else if(act==="skip"){if(G&&G.phase==="ask")reveal(null,"Skipped")}
  else if(act==="peek")peek();
  else if(act==="later")later();
  else if(act==="daily-result")end("daily",save.daily.total,save.daily.results);
  else if(act==="share")share();else if(act==="home")home();
});
// tap or press Enter during a reveal to move on
document.addEventListener("click",()=>{if(G&&G.phase==="reveal"&&performance.now()-G.lockedAt>500)next()});
document.getElementById("home-btn").addEventListener("click",home);
if(!route())home();
loadStats();
})();
</script>
