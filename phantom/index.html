<title>Phantom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen game. A full-bleed night scene (canvas) with a ghost in the middle;
   HUD on top, big tap tiles at the bottom. Single dark look by choice. */
:root{
  color-scheme:dark;
  --night:#1B0D2E; --bone:#F4EFE6; --dim:#A99BC2; --tile:#24143A; --edge:#3D2760;
  --pumpkin:#FF7A1A; --slime:#8FE04A;
  --t-common:#8C84A0; --t-uncommon:#8FE04A; --t-rare:#B07CFF; --t-epic:#FF7A1A; --t-legend:#FFD23F;
  --display:"Creepster","Chalkduster","Impact",fantasy;
  --body:"Rubik","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--bone);font-family:var(--body);font-size:16px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;padding-block:14px 18px;display:flex;flex-direction:column;gap:12px}
.app.quake{animation:quake .45s}
@keyframes quake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}

.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hud button{background:none;border:0;color:var(--bone);cursor:pointer;border-radius:10px;padding:6px 8px;margin:-6px -8px}
.logo{font:400 26px/1 var(--display);letter-spacing:.04em;color:var(--pumpkin)}
.right{display:flex;align-items:center;gap:14px}
.alt{font:800 20px/1 var(--body);font-variant-numeric:tabular-nums}
.alt small{font-size:12px;color:var(--dim);margin-left:3px}
#snd{font:700 12px/1 var(--body);color:var(--dim);letter-spacing:.08em}
:focus-visible{outline:3px solid var(--t-legend);outline-offset:2px}

#stage{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;animation:fade .35s both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.top{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}

.title{font:400 clamp(64px,22vw,104px)/.9 var(--display);color:var(--pumpkin);letter-spacing:.03em;margin:8px 0 0;text-shadow:0 5px 0 #7A2A00;animation:wob 3.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-2deg) translateY(4px)}}
.tag{font-weight:700;font-size:17px;color:var(--bone);margin:0}
.meta{font-weight:700;font-size:13px;color:var(--bone);text-shadow:0 1px 0 rgba(0,0,0,.6);margin:0;font-variant-numeric:tabular-nums}

.big{font:800 20px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:18px;padding:20px;cursor:pointer;width:100%;color:#1B0D2E;background:var(--pumpkin);box-shadow:0 6px 0 #A8480A;transition:transform .08s,box-shadow .08s;display:flex;justify-content:center;align-items:baseline;gap:10px}
.big small{font-size:13px;letter-spacing:0;text-transform:none;opacity:.75;font-weight:700}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 #A8480A}
.big.alt2{background:var(--t-rare);box-shadow:0 6px 0 #6B3FC0}
.big.alt2:active{box-shadow:0 1px 0 #6B3FC0}
.big.flat{background:var(--tile);color:var(--bone);box-shadow:0 6px 0 #120A20;font-size:15px;padding:16px}
.big.flat:active{box-shadow:0 1px 0 #120A20}
.btns{display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.pips{display:flex;gap:7px;justify-content:center}
.pip{width:26px;height:8px;border-radius:4px;background:var(--edge);transition:background .3s}
.pip.now{background:var(--bone)}
.hint{font:700 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--slime)}
.q{font:800 clamp(22px,6.4vw,30px)/1.12 var(--body);margin:0;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.45)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:6px}
.tile{position:relative;overflow:hidden;min-height:62px;border-radius:16px;border:2px solid var(--edge);background:var(--tile);color:var(--bone);font:700 16px/1.15 var(--body);padding:10px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;gap:8px;box-shadow:0 5px 0 #120A20;transition:transform .08s,box-shadow .08s,opacity .3s,border-color .2s;animation:drop .4s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d)}
@keyframes drop{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 #120A20}
.tile .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);opacity:.38;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tile .n,.tile .p{position:relative;min-width:0;overflow-wrap:anywhere}
.tile .p{font-weight:800;font-variant-numeric:tabular-nums;color:var(--c);display:none}
.tiles.done .tile{cursor:default;justify-content:space-between;text-align:left;opacity:.62}
.tiles.done .tile .p{display:block}
.tiles.done .tile .fill{width:var(--w)}
.tiles.done .tile.me{opacity:1;border-color:var(--c);transform:scale(1.03)}
.t-common{--c:var(--t-common)}.t-uncommon{--c:var(--t-uncommon)}.t-rare{--c:var(--t-rare)}.t-epic{--c:var(--t-epic)}.t-legend{--c:var(--t-legend)}

#pop{position:fixed;left:0;right:0;top:22%;z-index:3;text-align:center;pointer-events:none}
#pop div{animation:pop 1.7s cubic-bezier(.2,.9,.3,1) both;color:var(--c)}
#pop b{display:block;font:400 clamp(54px,17vw,84px)/1 var(--display);text-shadow:0 4px 0 rgba(0,0,0,.55)}
#pop span{font:800 14px/1 var(--body);letter-spacing:.22em;text-transform:uppercase}
@keyframes pop{0%{opacity:0;transform:translateY(40px) scale(.4)}18%{opacity:1;transform:translateY(0) scale(1.12)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}

.score{font:400 clamp(72px,24vw,120px)/.9 var(--display);color:var(--t-legend);text-shadow:0 5px 0 rgba(0,0,0,.5);font-variant-numeric:tabular-nums;margin-top:6px}
.score small{font-size:.35em;margin-left:.1em}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:22px;height:22px;border-radius:7px;background:var(--c);animation:drop .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
@media (max-height:640px){.tile{min-height:50px;font-size:15px}.q{font-size:21px}.big{padding:15px}.title{font-size:60px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="hud">
    <button class="logo" id="home-btn" type="button" aria-label="Phantom, back to start">Phantom</button>
    <div class="right">
      <button id="snd" type="button" aria-label="Toggle sound">SOUND ON</button>
      <div class="alt"><span id="alt-read">0</span><small>m</small></div>
    </div>
  </header>
  <main id="stage"></main>
</div>
<div id="pop" aria-live="polite"></div>

<script>
(()=>{
"use strict";
/* ---------- question bank: "Answer:percent" (percent = estimated share of people who pick it) ---------- */
const BANK=[
["Space","Name a planet in our solar system","Mars:24;Earth:22;Jupiter:14;Saturn:13;Venus:8;Mercury:7;Neptune:5;Uranus:4"],
["Geography","Name a country in South America","Brazil:34:brasil;Argentina:20;Peru:10;Colombia:10;Chile:9;Venezuela:5;Ecuador:4;Bolivia:3;Uruguay:2.5;Paraguay:1.5;Guyana:0.6;Suriname:0.4"],
["Colour","Name a colour of the rainbow","Red:30;Blue:22;Green:12;Yellow:11;Orange:9;Violet:6:purple;Indigo:5"],
["Games","Name a chess piece","Queen:26;King:22;Knight:18:horse;Pawn:14;Rook:9:castle;Bishop:8"],
["Geography","Name one of the Great Lakes","Superior:30;Michigan:28;Erie:18;Huron:12;Ontario:10"],
["Geography","Name a continent","Europe:22;Asia:20;Africa:20;North America:14;South America:8;Australia:8:oceania/australasia;Antarctica:7:antartica"],
["Geography","Name an ocean","Pacific:38;Atlantic:34;Indian:12;Arctic:10;Southern:4:antarctic"],
["Science","Name a noble gas","Helium:34;Neon:30;Argon:16;Xenon:8;Krypton:8;Radon:3;Oganesson:0.3"],
["Stars","Name a sign of the zodiac","Leo:14;Scorpio:11;Aries:10;Gemini:10;Virgo:9;Taurus:9;Cancer:8;Libra:8;Pisces:7;Capricorn:6;Aquarius:6;Sagittarius:5"],
["Calendar","Name a month of the year","December:16;January:14;July:12;June:9;October:9;May:8;August:7;March:6;April:6;February:6;September:5;November:4"],
["Calendar","Name a day of the week","Friday:28;Saturday:20;Monday:18;Sunday:16;Wednesday:8;Tuesday:6;Thursday:4"],
["Geography","Name a US state with a Pacific coastline","California:55;Hawaii:14;Oregon:12;Washington:12;Alaska:7"],
["Geography","Name a Nordic country","Sweden:32;Norway:28;Denmark:18;Finland:14;Iceland:8"],
["Geography","Name a country that shares a land border with France","Spain:26;Germany:24;Italy:18;Belgium:12;Switzerland:10;Luxembourg:4;Monaco:4;Andorra:2;Brazil:0.4;Netherlands:0.3:holland;Suriname:0.2"],
["Body","Name one of the five senses","Sight:34:vision/seeing/see;Smell:20;Taste:18;Hearing:15:sound/hear;Touch:13:feeling/feel"],
["Food","Name one of the five basic tastes","Sweet:36;Sour:20;Salty:18:salt;Bitter:16;Umami:10:savory/savoury"],
["Music","Name a member of The Beatles","John Lennon:36:john/lennon;Paul McCartney:30:paul/mccartney;Ringo Starr:20:ringo/starr;George Harrison:14:george/harrison"],
["Games","Name a suit in a deck of cards","Hearts:34;Spades:30;Diamonds:20;Clubs:16:club"],
["World","Name a G7 country","United States:30:usa/us/america/unitedstatesofamerica;Germany:16;France:14;United Kingdom:14:uk/britain/greatbritain/england;Japan:12;Canada:8;Italy:6"],
["Science","Name an element with a one-letter chemical symbol","Oxygen:24;Hydrogen:22;Carbon:16;Nitrogen:10;Potassium:6;Sulfur:4:sulphur;Fluorine:3;Phosphorus:3;Iodine:3;Boron:2.5;Uranium:2.5;Tungsten:1.5;Vanadium:1;Yttrium:0.5"],
["Culture","Name an animal of the Chinese zodiac","Dragon:22;Tiger:14;Rat:12;Monkey:9;Rabbit:8;Snake:8;Horse:6;Dog:6;Ox:5;Pig:4;Rooster:4;Goat:2:sheep/ram"],
["Sport","Name a tennis Grand Slam tournament","Wimbledon:52;US Open:22;French Open:14:rolandgarros;Australian Open:12"],
["Sport","Name a colour of the Olympic rings","Blue:28;Red:24;Yellow:18;Green:16;Black:14"],
["Geography","Name a country of the United Kingdom","England:46;Scotland:28;Wales:16;Northern Ireland:10"],
["Geography","Name a Canadian province","Ontario:28;Quebec:22;British Columbia:20:bc;Alberta:12;Manitoba:5;Nova Scotia:5;Saskatchewan:4;Newfoundland and Labrador:2:newfoundland;New Brunswick:1.2;Prince Edward Island:0.8:pei"],
["Animals","Name a big cat in the genus Panthera","Lion:36;Tiger:30;Leopard:16;Jaguar:14;Snow Leopard:4"],
["Geography","Name a country the equator crosses on land","Ecuador:30;Brazil:22;Kenya:16;Indonesia:10;Colombia:7;Uganda:5;Democratic Republic of the Congo:3:drc/drcongo/congo/congokinshasa;Somalia:2.5;Gabon:2;Republic of the Congo:1:congobrazzaville;Sao Tome and Principe:0.5:saotome"],
["Geography","Name a country in Central America","Costa Rica:26;Panama:22;Guatemala:16;Honduras:12;Nicaragua:9;El Salvador:8;Belize:7"],
["Language","Name a vowel in the English alphabet","A:38;E:24;I:14;O:14;U:10"],
["Calendar","Name a season","Summer:38;Winter:24;Autumn:22:fall;Spring:16"],
["Geography","Name one of the ten largest countries by area","Russia:30;Canada:16;China:16;United States:14:usa/us/america;Brazil:8;Australia:8;India:5;Argentina:1.5;Kazakhstan:1;Algeria:0.5"],
["Geography","Name a Baltic state","Estonia:38;Latvia:32;Lithuania:30"],
["Space","Name one of Jupiter's four Galilean moons","Europa:40;Ganymede:24;Io:22;Callisto:14"],
["Body","Name an ABO blood group","O:38;A:26;B:18;AB:18"],
["Geography","Name a US state that starts with M","Michigan:20;Massachusetts:16;Maine:12;Montana:12;Mississippi:12;Minnesota:10;Missouri:10;Maryland:8"],
["Geography","Name a country that starts with I","Italy:28;India:24;Ireland:16;Iceland:9;Indonesia:8;Israel:6;Iran:5;Iraq:4"],
["Numbers","Name a prime number below 30","2:22:two;7:20:seven;3:16:three;5:12:five;13:8:thirteen;11:7:eleven;17:5:seventeen;19:4:nineteen;23:4:twentythree;29:2:twentynine"],
["Geography","Name an African country on the Mediterranean Sea","Egypt:44;Morocco:24;Tunisia:14;Libya:10;Algeria:8"],
["Science","Name one of the five main layers of Earth's atmosphere","Stratosphere:34;Troposphere:24;Mesosphere:12;Thermosphere:10;Exosphere:8"]
];
const QS=BANK.map(([cat,q,raw])=>({q:q.replace(/^Name /,"").replace(/^./,c=>c.toUpperCase()),answers:raw.split(";").map(s=>{const[name,p]=s.split(":");return{name,p:+p}})}));

const MAXQ=1562, MOON=10934; // seven perfect picks reach the moon
const riseFor=p=>Math.max(40,Math.round(MAXQ*(1-Math.sqrt(Math.min(p,60)/60))));
const tierFor=p=>p>=20?["common","Common"]:p>=10?["uncommon","Uncommon"]:p>=4?["rare","Rare"]:p>=1.5?["epic","Epic!"]:["legend","Legendary!"];
const fmt=n=>Math.round(n).toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const TCOL={};["common","uncommon","rare","epic","legend"].forEach(k=>TCOL[k]=cssVar("--t-"+k));

/* ---------- storage ---------- */
const KEY="phantom.v1";
let save={plays:0,best:0,streak:0,lastDaily:null,daily:null,sound:true};
try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>dayKey();
function rng(seed){let h=1779033703;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),3432918353),h=h<<13|h>>>19;return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function shuffle(arr,rand){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- sound ---------- */
let ac=null;
function tone(f0,f1,dur,type="triangle",vol=.12){
  if(!save.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur)}catch(e){}
}
const sndBtn=document.getElementById("snd");
const sndLabel=()=>{sndBtn.textContent=save.sound?"SOUND ON":"SOUND OFF"};
sndBtn.addEventListener("click",()=>{save.sound=!save.sound;persist();sndLabel();tone(440,660,.12)});sndLabel();

/* ---------- scene ---------- */
const cv=document.getElementById("sky"),cx=cv.getContext("2d");
const SKY=[[0,[58,24,84]],[.25,[34,15,60]],[.65,[15,8,34]],[1,[6,4,16]]];
const PPM=.42;
let W=0,H=0,target=0,shown=0,rush=0,last=0,clock=0,mood=0,moodUntil=0;
const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.6,ph:Math.random()*6}));
const clouds=Array.from({length:26},(_,i)=>({alt:260+i*420+Math.random()*200,x:Math.random(),w:90+Math.random()*120,v:(Math.random()-.5)*.00012}));
const bats=Array.from({length:6},(_,i)=>({x:Math.random(),y:.1+Math.random()*.5,dir:i%2?1:-1,v:.5+Math.random()*.7,s:7+Math.random()*7,ph:Math.random()*6}));
let parts=[];
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
function skyAt(t){t=Math.max(0,Math.min(1,t));for(let i=1;i<SKY.length;i++){if(t<=SKY[i][0]){const[a,ca]=SKY[i-1],[b,cb]=SKY[i],k=(t-a)/(b-a);return ca.map((v,j)=>Math.round(v+(cb[j]-v)*k))}}return SKY[SKY.length-1][1]}
function burst(color,n){const gy=H*.42;for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*6;parts.push({x:W/2,y:gy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c:color,r:2+Math.random()*4})}}

function pumpkin(x,y,s){
  cx.fillStyle="#FF7A1A";cx.beginPath();cx.ellipse(x,y,s,s*.8,0,0,7);cx.fill();
  cx.fillStyle="#D85C0A";cx.beginPath();cx.ellipse(x,y,s*.45,s*.8,0,0,7);cx.fill();
  cx.fillStyle="#3E7A1E";cx.fillRect(x-s*.1,y-s*1.05,s*.2,s*.32);
  const g=.75+.25*Math.sin(clock*5+x);cx.fillStyle=`rgba(255,220,90,${g})`;
  cx.beginPath();cx.moveTo(x-s*.5,y-s*.1);cx.lineTo(x-s*.18,y-s*.1);cx.lineTo(x-s*.34,y-s*.4);cx.fill();
  cx.beginPath();cx.moveTo(x+s*.5,y-s*.1);cx.lineTo(x+s*.18,y-s*.1);cx.lineTo(x+s*.34,y-s*.4);cx.fill();
  cx.beginPath();cx.moveTo(x-s*.5,y+s*.18);cx.lineTo(x-s*.25,y+s*.42);cx.lineTo(x,y+s*.24);cx.lineTo(x+s*.25,y+s*.42);cx.lineTo(x+s*.5,y+s*.18);cx.lineTo(x,y+s*.36);cx.fill();
}
function tomb(x,y,w,h,tilt,cross){
  cx.save();cx.translate(x,y);cx.rotate(tilt);cx.fillStyle="#2B1B45";
  if(cross){cx.fillRect(-w*.14,-h,w*.28,h);cx.fillRect(-w*.5,-h*.72,w,h*.2)}
  else{cx.beginPath();cx.moveTo(-w/2,0);cx.lineTo(-w/2,-h+w/2);cx.arc(0,-h+w/2,w/2,Math.PI,0);cx.lineTo(w/2,0);cx.fill();cx.fillStyle="#3D2760";cx.fillRect(-w*.22,-h*.62,w*.44,3);cx.fillRect(-w*.22,-h*.46,w*.3,3)}
  cx.restore();
}
function tree(x,y,s){
  cx.strokeStyle="#0B0614";cx.lineCap="round";
  const br=(x1,y1,a,l,w,d)=>{const x2=x1+Math.cos(a)*l,y2=y1+Math.sin(a)*l;cx.lineWidth=w;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke();if(d>0){br(x2,y2,a-.55,l*.68,w*.62,d-1);br(x2,y2,a+.45,l*.62,w*.62,d-1)}};
  br(x,y,-Math.PI/2+.08,s,s*.16,3);
}
function ground(g){
  if(g>H+140)return;
  const glow=cx.createLinearGradient(0,g-220,0,g);glow.addColorStop(0,"rgba(255,122,26,0)");glow.addColorStop(1,"rgba(255,122,26,.34)");cx.fillStyle=glow;cx.fillRect(0,g-220,W,220);
  const u=Math.min(W,560)/400;
  tree(W*.12,g+6,74*u);tree(W*.9,g+6,58*u);
  cx.fillStyle="#0B0614";cx.beginPath();cx.moveTo(0,g+10);cx.quadraticCurveTo(W*.25,g-22,W*.5,g+2);cx.quadraticCurveTo(W*.78,g+22,W,g-8);cx.lineTo(W,H+10);cx.lineTo(0,H+10);cx.fill();
  tomb(W*.27,g-2,26*u,40*u,-.1);tomb(W*.42,g+2,22*u,44*u,.05,true);tomb(W*.66,g+8,28*u,36*u,.12);tomb(W*.8,g+4,20*u,38*u,-.06,true);
  pumpkin(W*.2,g+4,11*u);pumpkin(W*.56,g+6,14*u);pumpkin(W*.74,g+12,9*u);
}
function ghost(x,y,s){
  const up=gapDir()*rush,st=1+Math.abs(up)*.22;
  cx.save();cx.translate(x,y);cx.scale(1/Math.sqrt(st),st);
  cx.fillStyle="rgba(244,239,230,.12)";cx.beginPath();cx.arc(0,s*.2,s*1.7,0,7);cx.fill();
  cx.fillStyle="#F4EFE6";cx.beginPath();cx.arc(0,0,s,Math.PI,0);cx.lineTo(s,s*1.25);
  for(let i=0;i<4;i++){const x1=s-(i+.5)*(s/2),x2=s-(i+1)*(s/2),w=Math.sin(clock*5+i*1.4)*s*.07;cx.quadraticCurveTo(x1,s*1.25+(i%2?-s*.24:s*.24)+w,x2,s*1.25)}
  cx.closePath();cx.fill();
  const ey=-s*.12-up*s*.12;cx.fillStyle="#1B0D2E";
  if(mood===1&&clock<moodUntil){cx.lineWidth=s*.11;cx.strokeStyle="#1B0D2E";cx.lineCap="round";for(const d of[-1,1]){cx.beginPath();cx.arc(d*s*.36,ey+s*.06,s*.14,Math.PI,0);cx.stroke()}cx.beginPath();cx.arc(0,s*.3,s*.26,.1,Math.PI-.1);cx.fill()}
  else{const blink=Math.sin(clock*.9)>.985?.15:1;for(const d of[-1,1]){cx.beginPath();cx.ellipse(d*s*.36,ey,s*.14,s*.2*blink,0,0,7);cx.fill()}
    cx.beginPath();if(mood===2&&clock<moodUntil){cx.lineWidth=s*.09;cx.strokeStyle="#1B0D2E";cx.arc(0,s*.52,s*.2,Math.PI+.4,-.4);cx.stroke()}else{cx.ellipse(0,s*.36,s*.12,s*.16,0,0,7);cx.fill()}}
  cx.fillStyle="rgba(255,122,26,.35)";for(const d of[-1,1]){cx.beginPath();cx.ellipse(d*s*.62,s*.2,s*.13,s*.08,0,0,7);cx.fill()}
  cx.restore();
}
const gapDir=()=>target>=shown?1:-1;
const altRead=document.getElementById("alt-read");
function frame(ts){
  const dt=Math.min(3,(ts-last)/16.7||1);last=ts;clock+=dt/60;
  const gap=target-shown;
  if(reduced)shown=target;else shown+=gap*Math.min(1,.05*dt);
  if(Math.abs(target-shown)<.6)shown=target;
  rush=reduced?0:Math.min(1,Math.abs(gap)/450);
  const t=shown/MOON,c=skyAt(t),dir=gapDir();
  altRead.textContent=fmt(shown);
  cx.globalAlpha=1;cx.fillStyle=`rgb(${c})`;cx.fillRect(0,0,W,H);
  document.body.style.background=`rgb(${c})`;
  const gy=H*.42;
  // stars
  cx.fillStyle="#F4EFE6";
  for(const s of stars){const y=((s.y*H+shown*.05)%H+H)%H,x=s.x*W;cx.globalAlpha=(.3+.6*t)*(.6+.4*Math.sin(clock*2+s.ph));
    if(rush>.15)cx.fillRect(x,y,1.5,dir*rush*26);else{cx.beginPath();cx.arc(x,y,s.r,0,7);cx.fill()}}
  // moon: far away at first, fills the sky by the top
  const mr=26+(Math.min(W,H)*.34-26)*t,mx=W*.84+(W/2-W*.84)*t,my=H*.3+(gy-H*.3)*t;
  cx.globalAlpha=.1;cx.fillStyle="#FFE9A8";cx.beginPath();cx.arc(mx,my,mr*1.35,0,7);cx.fill();
  cx.globalAlpha=1;cx.fillStyle="#F6E7B0";cx.beginPath();cx.arc(mx,my,mr,0,7);cx.fill();
  cx.fillStyle="#E2CD8A";for(const[a,b,r]of[[-.35,-.25,.2],[.3,.1,.14],[-.1,.45,.17],[.42,-.42,.09]]){cx.beginPath();cx.arc(mx+a*mr,my+b*mr,r*mr,0,7);cx.fill()}
  // clouds at fixed altitudes
  cx.fillStyle="#2A1746";
  for(const cl of clouds){const y=gy+(shown-cl.alt)*PPM;cl.x+=cl.v*dt;if(cl.x>1.3)cl.x=-.3;if(cl.x<-.3)cl.x=1.3;if(y<-60||y>H+60)continue;const x=cl.x*W,w=cl.w;cx.globalAlpha=.8;
    cx.beginPath();cx.ellipse(x,y,w*.5,w*.13,0,0,7);cx.ellipse(x-w*.2,y-w*.08,w*.22,w*.14,0,0,7);cx.ellipse(x+w*.14,y-w*.1,w*.26,w*.17,0,0,7);cx.fill()}
  cx.globalAlpha=1;
  ground(gy+H*.17+shown*PPM);
  // bats
  cx.fillStyle="#0B0614";
  for(const b of bats){b.x+=b.dir*b.v*.0022*dt;b.ph+=.3*dt;b.y+=dir*rush*.03*dt;if(b.x>1.1){b.x=-.1;b.y=.08+Math.random()*.5}if(b.x<-.1){b.x=1.1;b.y=.08+Math.random()*.5}if(b.y>1.1)b.y=-.05;
    const x=b.x*W,y=b.y*H+Math.sin(b.ph*.3)*6,s=b.s,f=Math.sin(b.ph)*s*.7;
    cx.beginPath();cx.moveTo(x,y);cx.quadraticCurveTo(x-s,y-s*.9-f,x-s*2,y-f*.6);cx.quadraticCurveTo(x-s*1.2,y+s*.1,x-s*.6,y+s*.45);cx.lineTo(x,y+s*.25);cx.lineTo(x+s*.6,y+s*.45);cx.quadraticCurveTo(x+s*1.2,y+s*.1,x+s*2,y-f*.6);cx.quadraticCurveTo(x+s,y-s*.9-f,x,y);cx.fill()}
  // trail + particles
  if(rush>.12&&!reduced)for(let i=0;i<2;i++)parts.push({x:W/2+(Math.random()-.5)*40,y:gy+44,vx:(Math.random()-.5)*1.2,vy:dir*(3+Math.random()*5),life:.8,c:"#F4EFE6",r:2+Math.random()*4});
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.life-=.022*dt;if(p.life<=0)continue;cx.globalAlpha=Math.max(0,p.life)*.9;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
  parts=parts.filter(p=>p.life>0);cx.globalAlpha=1;
  ghost(W/2,gy+Math.sin(clock*2.2)*7,Math.min(42,H*.055));
  requestAnimationFrame(frame);
}
addEventListener("resize",resize);resize();requestAnimationFrame(frame);

/* ---------- game ---------- */
const stage=document.getElementById("stage"),app=document.getElementById("app"),pop=document.getElementById("pop");
let G=null,recent=[],timer=0;
const show=html=>{clearTimeout(timer);pop.innerHTML="";stage.innerHTML=html};

function home(){
  G=null;target=0;
  const done=save.daily&&save.daily.date===today();
  show(`<section class="screen">
    <div class="top"><h1 class="title">Phantom</h1><p class="tag">Pick what nobody picks. Float to the moon.</p></div>
    <div class="btns">
      ${save.plays?`<p class="meta" style="text-align:center">Best ${fmt(save.best)} m · Streak ${save.streak}</p>`:""}
      <button class="big" data-act="${done?"daily-result":"daily"}" type="button">Daily Rise${done?`<small>${fmt(save.daily.total)} m today</small>`:""}</button>
      <button class="big alt2" data-act="free" type="button">Free Rise<small>unlimited</small></button>
    </div>
  </section>`);
}
function start(mode){
  const rand=mode==="daily"?rng("phantom-"+today()):Math.random;
  let pool=QS.map((_,i)=>i);if(mode==="free")pool=pool.filter(i=>!recent.includes(i));
  const qs=shuffle(pool,rand).slice(0,7);
  if(mode==="free")recent=qs.concat(recent).slice(0,21);
  const opts=qs.map(i=>shuffle(shuffle(QS[i].answers,rand).slice(0,6),rand));
  G={mode,qs,opts,i:0,total:0,results:[],locked:false};
  tone(200,500,.25);question();
}
function question(){
  const q=QS[G.qs[G.i]],o=G.opts[G.i];G.locked=false;
  show(`<section class="screen">
    <div class="top">
      <div class="pips">${G.qs.map((_,k)=>{const r=G.results[k];return`<span class="pip ${k===G.i?"now":""}" ${r?`style="background:${TCOL[r.tier]}"`:""}></span>`}).join("")}</div>
      <span class="hint">Pick the rarest</span>
      <h2 class="q">${esc(q.q)}</h2>
    </div>
    <div class="tiles" id="tiles">${o.map((a,k)=>`<button class="tile t-${tierFor(a.p)[0]}" data-pick="${k}" type="button" style="--d:${k*.05}s;--w:${Math.max(6,a.p/Math.max(...o.map(x=>x.p))*100)}%"><span class="fill"></span><span class="n">${esc(a.name)}</span><span class="p">${a.p}%</span></button>`).join("")}</div>
  </section>`);
}
function pick(k,btn){
  if(!G||G.locked)return;G.locked=true;G.lockedAt=performance.now();
  const a=G.opts[G.i][k],rise=riseFor(a.p),[tier,label]=tierFor(a.p);
  G.results[G.i]={tier,rise};G.total+=rise;target=G.total;
  document.getElementById("tiles").classList.add("done");btn.classList.add("me");
  const rank=["common","uncommon","rare","epic","legend"].indexOf(tier);
  mood=rank>=2?1:rank===0?2:0;moodUntil=clock+1.8;
  burst(TCOL[tier],10+rank*12);
  if(rank>=3&&!reduced){app.classList.remove("quake");void app.offsetWidth;app.classList.add("quake")}
  tone(180,260+rise*.75,.45,"triangle");if(rank>=3)setTimeout(()=>tone(700,1400,.3,"sine",.08),160);
  pop.innerHTML=`<div class="t-${tier}"><b>+${fmt(rise)}</b><span>${label}</span></div>`;
  timer=setTimeout(next,2100);
}
function next(){
  clearTimeout(timer);if(!G)return;
  G.i++;if(G.i<7)return question();
  save.plays++;save.best=Math.max(save.best,G.total);
  if(G.mode==="daily"){const y=new Date();y.setDate(y.getDate()-1);save.streak=save.lastDaily===dayKey(y)?save.streak+1:1;save.lastDaily=today();save.daily={date:today(),total:G.total,results:G.results}}
  persist();end(G.mode,G.total,G.results);
}
const SQ={common:"⬜",uncommon:"🟩",rare:"🟪",epic:"🟧",legend:"🟨"};
let shareText="";
function end(mode,total,res){
  G=null;target=total;const left=MOON-total;
  shareText=`Phantom ${mode==="daily"?"Daily Rise":"Free Rise"}\n${fmt(total)} m 👻\n${res.map(r=>SQ[r.tier]).join("")}`;
  tone(300,900,.5,"sine");
  show(`<section class="screen">
    <div class="top">
      <div class="score"><span id="score">0</span><small>m</small></div>
      <div class="dots">${res.map((r,k)=>`<i style="--c:${TCOL[r.tier]};--d:${.3+k*.09}s"></i>`).join("")}</div>
      <p class="meta">${left<300?"You reached the moon":fmt(left)+" m to the moon"}</p>
    </div>
    <div class="btns">
      <button class="big" data-act="free" type="button">Rise again</button>
      <div class="pair"><button class="big flat" data-act="share" id="share" type="button">Copy score</button><button class="big flat" data-act="home" type="button">Home</button></div>
    </div>
  </section>`);
  const el=document.getElementById("score");if(reduced){el.textContent=fmt(total);return}
  const t0=performance.now();(function step(now){const k=Math.min(1,(now-t0)/1300),e=1-Math.pow(1-k,3);el.textContent=fmt(total*e);if(k<1&&el.isConnected)requestAnimationFrame(step)})(t0);
}
function share(){
  const b=document.getElementById("share");
  try{navigator.clipboard.writeText(shareText).then(()=>{b.textContent="Copied"},()=>{b.textContent="Copy blocked"})}catch(e){b.textContent="Copy blocked"}
}
stage.addEventListener("click",e=>{
  const t=e.target.closest("[data-pick]");
  if(t){if(G&&!G.locked)pick(+t.dataset.pick,t);return}
  const b=e.target.closest("[data-act]");
  if(!b){return}
  const act=b.dataset.act;
  if(act==="daily")start("daily");else if(act==="free")start("free");
  else if(act==="daily-result")end("daily",save.daily.total,save.daily.results);
  else if(act==="share")share();else if(act==="home")home();
});
// tap anywhere during a reveal to move on
document.addEventListener("click",()=>{if(G&&G.locked&&performance.now()-G.lockedAt>500)next()});
document.getElementById("home-btn").addEventListener("click",home);
home();
})();
</script>
