{% extends "base.html" %}
{% block title %}{{ t('reset_title') }} - Meeting Ledger{% endblock %}
{% block auth_content %}
  <div class="auth-card">
    <h1>{{ t('reset_title') }}</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">{{ t('label_new_password') }}</label>
      <input type="password" id="password" name="password" minlength="8" required autofocus>
      <button type="submit">{{ t('btn_reset_password') }}</button>
    </form>
  </div>
{% endblock %}
