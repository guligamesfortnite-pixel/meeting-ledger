{% extends "base.html" %}
{% block title %}{{ t('forgot_password_title') }} - Meeting Ledger{% endblock %}
{% block auth_content %}
  <div class="auth-card">
    <h1>{{ t('forgot_password_title') }}</h1>
    <p class="tag">{{ t('forgot_password_sub') }}</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">{{ t('label_email') }}</label>
      <input type="email" id="email" name="email" required autofocus>
      <button type="submit">{{ t('btn_send_reset') }}</button>
    </form>
    <p class="form-foot"><a href="{{ url_for('login') }}">{{ t('login_link') }}</a></p>
  </div>
{% endblock %}
