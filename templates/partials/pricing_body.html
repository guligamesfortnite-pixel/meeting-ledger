<div style="max-width: 760px; {% if not user %}margin: 0 auto;{% endif %}">
  <div style="text-align: center; margin-bottom: 32px;">
    <h1>{{ t('pricing_title') }}</h1>
    <p class="page-sub">{{ t('pricing_sub') }}</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 12px;">
    {% for tier in tiers %}
      <div class="card" style="padding: 24px 20px;">
        <h2 style="margin-bottom: 2px;">{{ t(tier.key + '_title') }}</h2>
        <p style="color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 16px;">{{ t(tier.key + '_desc') }}</p>
        <div style="font-family: 'Sora', sans-serif; font-size: 1.6rem; font-weight: 700;">
          ${{ tier.price }}<span style="font-size: 0.9rem; font-weight: 500; color: var(--ink-soft);">{{ t('label_per_month') }}</span>
        </div>
      </div>
    {% endfor %}
  </div>
  <p style="text-align: center; color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 32px;">{{ t('plan_extra_note') }}</p>

  <div class="auth-card" style="margin: 0 auto; width: 380px;">
    <h2>{{ t('label_access_code') }}</h2>
    <form method="post" action="{{ url_for('redeem') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="code" placeholder="{{ t('placeholder_access_code') }}" required>
      <button type="submit">{{ t('btn_redeem') }}</button>
    </form>
  </div>
</div>
