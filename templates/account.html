{% extends "base.html" %}
{% block title %}{{ t('account_title') }} - Meeting Ledger{% endblock %}
{% block content %}
  <div class="page-head">
    <div><h1>{{ t('account_title') }}</h1></div>
  </div>

  <div class="section" style="margin-top: 0;">
    <h2>{{ t('account_profile_heading') }}</h2>
    <div class="card" style="padding: 24px 26px;">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="update_profile">
        <label for="name">{{ t('label_name') }}</label>
        <input type="text" id="name" name="name" required value="{{ user['name'] }}">
        <label for="email">{{ t('label_email') }}</label>
        <input type="email" id="email" name="email" required value="{{ user['email'] }}">
        <button type="submit">{{ t('btn_save_profile') }}</button>
      </form>
    </div>
  </div>

  <div class="section">
    <h2>{{ t('account_password_heading') }}</h2>
    <div class="card" style="padding: 24px 26px;">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="change_password">
        <label for="current_password">{{ t('label_current_password') }}</label>
        <input type="password" id="current_password" name="current_password" required>
        <label for="new_password">{{ t('label_new_password') }}</label>
        <input type="password" id="new_password" name="new_password" minlength="8" required>
        <button type="submit">{{ t('btn_change_password') }}</button>
      </form>
    </div>
  </div>
{% endblock %}
